name: Integration - Update Acronyms (dry-run)

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'specs/**/templates/**'

jobs:
  dry-run:
    name: Dry-run updateAcronyms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run update acronyms dry-run
        run: |
          # Run the integration tests which exercise the dry-run/apply flow
          npm test --silent
        env:
          CI: true
